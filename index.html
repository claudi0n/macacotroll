  <script>
    // Tenta iniciar automaticamente. Alguns navegadores bloqueiam
    // autoplay com som até que o usuário interaja com a página.
    window.addEventListener("load", async () => {
      const audio = document.getElementById("monkey");
      audio.volume = 1.0;
      try {
        await audio.play();
      } catch (e) {
        // O navegador pode exigir uma interação do usuário.
        const start = async () => {
          try { await audio.play(); } catch (_) {}
          document.removeEventListener("touchstart", start);
          document.removeEventListener("click", start);
          document.removeEventListener("pointerdown", start);
        };
        document.addEventListener("touchstart", start, { once: true });
        document.addEventListener("click", start, { once: true });
        document.addEventListener("pointerdown", start, { once: true });
      }
    });
  </script>
